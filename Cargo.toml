[package]
name = "runemd"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "384c2991e582418ba529835279c5876ac3915e02", features = ["tooling", "native-file-dialog"] }
rune-kit = { path = "vendor/rune-kit", features = ["markdown", "mermaid"] } # Rune rev 384c2991, vendored with two hooks (vendor/rune-kit/VENDOR.md)
rune-fx = { path = "vendor/rune-fx" } # Rune rev 384c2991, vendored with one change (vendor/rune-fx/VENDOR.md)
wgpu = { version = "30", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
notify = "8.2"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

# Same patches as Rune's root Cargo.toml, from the same rev (crates/rune/README.md, "Depending on Rune").
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "384c2991e582418ba529835279c5876ac3915e02" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "384c2991e582418ba529835279c5876ac3915e02" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "384c2991e582418ba529835279c5876ac3915e02" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "384c2991e582418ba529835279c5876ac3915e02" }

[profile.release]
codegen-units = 16

[profile.perf]
inherits = "release"
opt-level = 3
lto = false
debug = false
incremental = false

[features]
# Rune's per-frame stage log (`RUNE_FRAME_LOG=file`), for measurement builds only.
frame-profile = ["rune/frame-profile"]

[dev-dependencies]
tempfile = "3"
